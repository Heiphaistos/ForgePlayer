include = [{ path = "config.local.toml", optional = true }]

# Windows x64 MSVC target
# crt-static : lie le runtime C (vcruntime140/msvcp140) en statique → binaire portable
# sans VC++ Redistributable installé (indispensable pour la release ZIP).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+avx2,+fma,+crt-static", "-C", "control-flow-guard"]

[env]
FFMPEG_DIR      = "C:/ffmpeg"
LIBCLANG_PATH   = "C:/Program Files/LLVM/bin"
RUST_LOG        = "info"
# Use clang-cl so cc crate can compile FFmpeg's check.c (needs __attribute__ support)
CC              = "C:/Program Files/LLVM/bin/clang-cl.exe"
CXX             = "C:/Program Files/LLVM/bin/clang-cl.exe"
# Surcharges de poste (chemins MinGW/clang propres a la machine, BINDGEN_EXTRA_CLANG_ARGS) :
# .cargo/config.local.toml, non versionne.

[build]
# jobs = 0   # désactivé — utilise la valeur par défaut (nombre de cores)
